name: "Daily BTC Historical Tracker Sync"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-btc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch BTC Telemetry, Render SVG & Dashboard
        run: python fetch_btc.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/btc_trend.svg
          if git diff --staged --quiet; then
            echo "No changes detected in README.md or SVG. Skipping commit."
          else
            git commit -m "chore(auto): daily BTC telemetry & trend chart snapshot [$(date -u +'%Y-%m-%d')]"
            git push
          fi
